<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sphere Vegas Replica - Arial View</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030305;
      font-family: monospace;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }
    #ui {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: #888;
      font-size: 12px;
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="ui">Hover over sphere &amp; scroll: Up = Anti-clockwise | Down = Clockwise</div>

  <script>
    // --- 1. Scene & Static Camera Setup (Arial View) ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x0a101f);
    
    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      1,
      2000
    );
    camera.position.set(0, 30, 80);
    camera.lookAt(0, -10, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // --- 2. Truncated Sphere Geometry ---
    const radius = 10;
    const widthSegments = 256;
    const heightSegments = 128;
    const phiStart = 0;
    const phiLength = Math.PI * 2;
    const thetaStart = 0;
    const thetaLength = 2.32;

    const sphereGeo = new THREE.SphereGeometry(
      radius,
      widthSegments,
      heightSegments,
      phiStart,
      phiLength,
      thetaStart,
      thetaLength
    );

    sphereGeo.computeBoundingBox();
    const box = sphereGeo.boundingBox;
    const verticalCenterOffset = -(box.max.y + box.min.y) / 2;
    sphereGeo.translate(0, verticalCenterOffset, 0);

    // --- 3. Custom LED Puck Shader ---
    const sphereShaderMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uLedDensity: { value: new THREE.Vector2(160.0, 80.0) },
        uPuckSize: { value: 0.72 },
      },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vPosition;
        void main() {
          vUv = uv;
          vNormal = normalize(normalMatrix * normal);
          vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform vec2 uLedDensity;
        uniform float uPuckSize;
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vPosition;

        #define PI 3.14159265359

        vec3 generateSphereContent(vec2 uv, float t) {
          vec2 p = uv * 2.0 - 1.0;
          p.x *= 1.5;
          float r = length(p);
          
          float ring = sin(r * 18.0 - t * 3.0);
          
          vec3 col1 = vec3(1.0, 0.2, 0.05);
          vec3 col2 = vec3(0.05, 0.6, 1.0);
          vec3 col3 = vec3(0.9, 0.0, 0.4);
          
          vec3 col = mix(col1, col2, 0.5 + 0.5 * sin(t + p.x * 2.0));
          col = mix(col, col3, step(0.6, ring));
          
          if (r < 0.35) {
            col = mix(vec3(1.0, 1.0, 1.0), col1, r / 0.35);
          }
          return col;
        }

        void main() {
          // 1. Calculate polar angle theta (0 at top pole, PI at bottom)
          float theta = vUv.y * PI;
          
          // 2. Circumference scaling factor: keeps physical spacing equal
          float ringScale = max(sin(theta), 0.08);

          // Physical uniform grid coordinates
          vec2 puckCount = vec2(floor(uLedDensity.x * ringScale), uLedDensity.y);
          puckCount.x = max(puckCount.x, 8.0);

          vec2 cellCoord = floor(vUv * puckCount);
          vec2 cellUv = fract(vUv * puckCount) * 2.0 - 1.0;

          // 3. Puck distance from cell center
          float dist = length(cellUv);

          // 4. Screen-space derivative anti-aliasing (filters out Moiré interference)
          float delta = fwidth(dist);
          float puckMask = 1.0 - smoothstep(uPuckSize - delta, uPuckSize + delta, dist);

          // Sample visual content based on cell coordinate
          vec2 sampleUv = (cellCoord + 0.5) / puckCount;
          vec3 emission = generateSphereContent(sampleUv, uTime);

          vec3 finalColor = emission * puckMask;

          // Rim lighting
          float rim = 1.0 - max(dot(vec3(0.0, 0.0, 1.0), vNormal), 0.0);
          finalColor += pow(rim, 3.0) * 0.15 * emission;

          gl_FragColor = vec4(finalColor, 1.0);
        }
      `,
      side: THREE.FrontSide
    });

    // --- 4. Position & Rotate the Sphere ---
    const sphereGroup = new THREE.Group();
    scene.add(sphereGroup);

    sphereGroup.position.set(-10, -10, 0);

    const dome = new THREE.Mesh(sphereGeo, sphereShaderMaterial);
    sphereGroup.add(dome);

    const innerHullGeo = sphereGeo.clone();
    const innerHullMat = new THREE.MeshBasicMaterial({ color: 0x010101, side: THREE.BackSide });
    const innerHull = new THREE.Mesh(innerHullGeo, innerHullMat);
    sphereGroup.add(innerHull);

    // --- 5. Raycaster & Hover-Scroll Rotation Handling ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(-999, -999);
    let targetRotationY = 0;

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    window.addEventListener('wheel', (e) => {
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(dome);

      if (intersects.length > 0) {
        e.preventDefault();
        const step = 0.08;
        if (e.deltaY > 0) {
          targetRotationY -= step;
        } else if (e.deltaY < 0) {
          targetRotationY += step;
        }
      }
    }, { passive: false });

    // --- 6. Window Resize ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 7. Render Loop ---
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      
      const elapsedTime = clock.getElapsedTime();
      sphereShaderMaterial.uniforms.uTime.value = elapsedTime;

      sphereGroup.rotation.y += (targetRotationY - sphereGroup.rotation.y) * 0.1;

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
