<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sphere Vegas Replica with Interactive Emoji Face</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #030305;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #sphere-widget-container {
      width: 520px;
      height: 410px;
      position: relative;
      border: none;
      background: transparent;
      overflow: hidden;
    }

    #sphere-widget-container canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #status-ui {
      margin-top: 15px;
      color: #888;
      font-size: 13px;
      user-select: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="sphere-widget-container"></div>
  <div id="status-ui">Cursor Status: <span id="cursor-state" style="color: #ff5555;">OUTSIDE</span></div>

  <script>
    // =========================================================================
    // 1. CONTAINER BOUNDS & INTERACTION TRACKING
    // =========================================================================
    const widgetContainer = document.getElementById('sphere-widget-container');
    const statusText = document.getElementById('cursor-state');

    let isPointerInsideContainer = false;
    let textureState = 'NONE';

    widgetContainer.addEventListener('mouseenter', () => {
      isPointerInsideContainer = true;
      statusText.textContent = 'INSIDE';
      statusText.style.color = '#00ffff';
    });

    widgetContainer.addEventListener('mouseleave', () => {
      isPointerInsideContainer = false;
      statusText.textContent = 'OUTSIDE';
      statusText.style.color = '#ff5555';
    });

    const windowMouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

    // Idle tracking: lastMoveTime = ANY mouse movement anywhere on the page (global sleep trigger).
    // lastInsideMoveTime = movement specifically inside the widget (used for the "stopped hovering" expressive faces).
    let lastMoveTime = performance.now();
    let lastInsideMoveTime = performance.now();

    window.addEventListener('mousemove', (e) => {
      windowMouse.x = e.clientX;
      windowMouse.y = e.clientY;
      lastMoveTime = performance.now();
    });

    widgetContainer.addEventListener('mousemove', () => {
      lastInsideMoveTime = performance.now();
    });

    // =========================================================================
    // 2. PROCEDURAL EMOJI FACE DRAWING (2D CANVAS)
    // =========================================================================
    const faceCanvas = document.createElement('canvas');
    faceCanvas.width = 1024;
    faceCanvas.height = 512;
    const faceCtx = faceCanvas.getContext('2d');
    const faceTexture = new THREE.CanvasTexture(faceCanvas);

    function drawYellowBase() {
      const w = faceCanvas.width;
      const h = faceCanvas.height;
      faceCtx.fillStyle = '#ffcc00';
      faceCtx.fillRect(0, 0, w, h);

      const radialGrad = faceCtx.createRadialGradient(w * 0.5, h * 0.45, 50, w * 0.5, h * 0.45, 450);
      radialGrad.addColorStop(0, 'rgba(255, 235, 80, 0.4)');
      radialGrad.addColorStop(1, 'rgba(230, 140, 0, 0.5)');
      faceCtx.fillStyle = radialGrad;
      faceCtx.fillRect(0, 0, w, h);
    }

    // -------------------------------------------------------------------
    // BLINK ENGINE (shared by all faces so everything feels alive)
    // -------------------------------------------------------------------
    let blinkTimer = 2000 + Math.random() * 3000;
    let blinkAnim = -1;
    let lastFrameT = performance.now();

    function updateBlink(dt) {
      if (blinkAnim >= 0) {
        blinkAnim += dt;
        if (blinkAnim > 220) { blinkAnim = -1; blinkTimer = 2000 + Math.random() * 3000; }
      } else {
        blinkTimer -= dt;
        if (blinkTimer <= 0) blinkAnim = 0;
      }
    }

    function eyeOpenAmt() {
      if (blinkAnim < 0) return 1;
      const p = blinkAnim / 220;
      return p < 0.5 ? 1 - p * 2 : (p - 0.5) * 2;
    }

    function drawAliveEye(cx, cy, r, pupilX = 0, pupilY = 0) {
      const open = eyeOpenAmt();
      const ry = r * Math.max(open, 0.08);
      faceCtx.save();
      if (open > 0.15) {
        faceCtx.beginPath(); faceCtx.ellipse(cx, cy, r, ry, 0, 0, Math.PI * 2);
        faceCtx.fillStyle = '#ffffff'; faceCtx.fill();

        faceCtx.beginPath(); faceCtx.ellipse(cx + pupilX, cy + pupilY, r * 0.55, ry * 0.55, 0, 0, Math.PI * 2);
        faceCtx.fillStyle = '#1c1b22'; faceCtx.fill();

        faceCtx.beginPath(); faceCtx.ellipse(cx + pupilX - r * 0.18, cy + pupilY - ry * 0.25, r * 0.15, ry * 0.15, 0, 0, Math.PI * 2);
        faceCtx.fillStyle = '#ffffff'; faceCtx.fill();
      } else {
        faceCtx.strokeStyle = '#221808'; faceCtx.lineWidth = 6; faceCtx.lineCap = 'round';
        faceCtx.beginPath(); faceCtx.moveTo(cx - r, cy); faceCtx.lineTo(cx + r, cy); faceCtx.stroke();
      }
      faceCtx.restore();
    }

    function drawHeart(cx, cy, s, alpha = 1) {
      faceCtx.save();
      faceCtx.globalAlpha = alpha;
      faceCtx.fillStyle = '#ff3f5c';
      faceCtx.beginPath();
      faceCtx.moveTo(cx, cy + s * 0.3);
      faceCtx.bezierCurveTo(cx, cy, cx - s / 2, cy, cx - s / 2, cy + s * 0.3);
      faceCtx.bezierCurveTo(cx - s / 2, cy + s * 0.7, cx, cy + s * 0.85, cx, cy + s);
      faceCtx.bezierCurveTo(cx, cy + s * 0.85, cx + s / 2, cy + s * 0.7, cx + s / 2, cy + s * 0.3);
      faceCtx.bezierCurveTo(cx + s / 2, cy, cx, cy, cx, cy + s * 0.3);
      faceCtx.fill();
      faceCtx.restore();
    }

    // --- FACE A: COOL SUNGLASSES (button front, sunglasses hide the eyes) ---
    function drawSunglassesFace(cx, cy) {
      faceCtx.save();
      faceCtx.strokeStyle = '#221808';
      faceCtx.lineWidth = 8;
      faceCtx.beginPath();
      faceCtx.arc(cx, cy + 40, 30, 0.2, Math.PI - 0.2);
      faceCtx.stroke();

      faceCtx.fillStyle = '#111116';
      faceCtx.beginPath();
      if (faceCtx.roundRect) {
        faceCtx.roundRect(cx - 75, cy - 40, 60, 45, 12);
        faceCtx.roundRect(cx + 15, cy - 40, 60, 45, 12);
      } else {
        faceCtx.rect(cx - 75, cy - 40, 60, 45);
        faceCtx.rect(cx + 15, cy - 40, 60, 45);
      }
      faceCtx.fill();

      faceCtx.beginPath();
      faceCtx.moveTo(cx - 15, cy - 25);
      faceCtx.lineTo(cx + 15, cy - 25);
      faceCtx.lineWidth = 6;
      faceCtx.stroke();

      faceCtx.fillStyle = 'rgba(255,255,255,0.25)';
      faceCtx.beginPath();
      if (faceCtx.roundRect) {
        faceCtx.roundRect(cx - 65, cy - 35, 20, 15, 4);
        faceCtx.roundRect(cx + 25, cy - 35, 20, 15, 4);
      }
      faceCtx.fill();
      faceCtx.restore();
    }

    // --- FACE B: WINKING SMIRK (uses alive eye for the open eye) ---
    function drawWinkFace(cx, cy) {
      faceCtx.save();
      faceCtx.strokeStyle = '#221808';
      faceCtx.lineWidth = 8;
      faceCtx.lineCap = 'round';
      faceCtx.beginPath();
      faceCtx.arc(cx + 10, cy + 30, 25, 0, Math.PI * 0.7);
      faceCtx.stroke();

      // Left eye: closed wink (always closed, independent of blink engine)
      faceCtx.beginPath();
      faceCtx.arc(cx - 35, cy - 15, 20, Math.PI, Math.PI * 2);
      faceCtx.stroke();
      faceCtx.restore();

      // Right eye: alive (blinks along with everything else)
      drawAliveEye(cx + 35, cy - 15, 25, 3, 2);
    }

    // --- FACE C: BLUSHING SMILE (both eyes alive + blink) ---
    function drawBlushSmileFace(cx, cy) {
      faceCtx.save();
      faceCtx.fillStyle = 'rgba(255, 100, 100, 0.45)';
      faceCtx.beginPath();
      faceCtx.arc(cx - 50, cy + 15, 18, 0, Math.PI * 2);
      faceCtx.arc(cx + 50, cy + 15, 18, 0, Math.PI * 2);
      faceCtx.fill();

      faceCtx.strokeStyle = '#221808';
      faceCtx.lineWidth = 8;
      faceCtx.lineCap = 'round';
      faceCtx.beginPath();
      faceCtx.arc(cx, cy + 20, 30, 0, Math.PI);
      faceCtx.stroke();
      faceCtx.restore();

      drawAliveEye(cx - 35, cy - 15, 18, 0, 2);
      drawAliveEye(cx + 35, cy - 15, 18, 0, 2);
    }

    // --- IDLE EXPRESSIVE FACES (shown when hovering but not moving, and inspired by real Sphere faces) ---
    function drawSurprisedFace(cx, cy) { // Stitch-like wide-eyed shock
      drawAliveEye(cx - 95, cy - 10, 60, 0, 0);
      drawAliveEye(cx + 95, cy - 10, 60, 0, 0);
      faceCtx.save();
      faceCtx.fillStyle = '#3b1a10';
      faceCtx.beginPath(); faceCtx.ellipse(cx, cy + 95, 55, 40, 0, 0, Math.PI * 2); faceCtx.fill();
      faceCtx.fillStyle = '#fff';
      for (let i = -2; i <= 2; i++) {
        faceCtx.beginPath();
        faceCtx.moveTo(cx + i * 20 - 8, cy + 65);
        faceCtx.lineTo(cx + i * 20 + 8, cy + 65);
        faceCtx.lineTo(cx + i * 20, cy + 80);
        faceCtx.fill();
      }
      faceCtx.restore();
    }

    function drawLoveFace(cx, cy, t) { // Heart eyes + floating hearts
      drawHeart(cx - 95, cy - 25, 55);
      drawHeart(cx + 68, cy - 25, 55);
      faceCtx.strokeStyle = '#221808';
      faceCtx.lineWidth = 8;
      faceCtx.lineCap = 'round';
      faceCtx.beginPath();
      faceCtx.arc(cx, cy + 55, 28, 0.15, Math.PI - 0.15);
      faceCtx.stroke();
      for (let i = 0; i < 4; i++) {
        const fy = (t * 0.05 + i * 90) % 260;
        drawHeart(cx - 150 + i * 100, cy - 140 + fy, 16, 1 - fy / 260);
      }
    }

    function drawShyFace(cx, cy) { // Blushing closed-eye smile
      faceCtx.fillStyle = 'rgba(255,90,90,0.5)';
      faceCtx.beginPath();
      faceCtx.arc(cx - 70, cy + 20, 20, 0, Math.PI * 2);
      faceCtx.arc(cx + 70, cy + 20, 20, 0, Math.PI * 2);
      faceCtx.fill();
      faceCtx.strokeStyle = '#221808';
      faceCtx.lineWidth = 7;
      faceCtx.lineCap = 'round';
      faceCtx.beginPath(); faceCtx.arc(cx - 40, cy - 15, 16, Math.PI * 1.1, Math.PI * 1.9); faceCtx.stroke();
      faceCtx.beginPath(); faceCtx.arc(cx + 40, cy - 15, 16, Math.PI * 1.1, Math.PI * 1.9); faceCtx.stroke();
      faceCtx.beginPath(); faceCtx.arc(cx, cy + 35, 18, 0.3, Math.PI - 0.3); faceCtx.stroke();
    }

    function drawSmugFace(cx, cy) { // Mischievous raised-brow smirk (image 1 reference)
      faceCtx.strokeStyle = '#221808';
      faceCtx.lineWidth = 8;
      faceCtx.lineCap = 'round';
      faceCtx.beginPath(); faceCtx.moveTo(cx - 70, cy - 55); faceCtx.lineTo(cx - 25, cy - 45); faceCtx.stroke();
      faceCtx.beginPath(); faceCtx.moveTo(cx + 25, cy - 45); faceCtx.lineTo(cx + 70, cy - 55); faceCtx.stroke();
      drawAliveEye(cx - 45, cy - 15, 38, 4, 4);
      drawAliveEye(cx + 45, cy - 15, 38, 4, 4);
      faceCtx.beginPath();
      faceCtx.moveTo(cx - 45, cy + 45);
      faceCtx.quadraticCurveTo(cx + 10, cy + 75, cx + 60, cy + 35);
      faceCtx.stroke();
    }

    const IDLE_FACES = [drawSurprisedFace, drawLoveFace, drawShyFace, drawSmugFace];
    let idleFaceIdx = 0;
    let idleFaceSwitchAt = 0;

    function renderIdleExpressiveFace(t) {
      drawYellowBase();
      if (t > idleFaceSwitchAt) {
        idleFaceIdx = Math.floor(Math.random() * IDLE_FACES.length);
        idleFaceSwitchAt = t + 2500;
      }
      IDLE_FACES[idleFaceIdx](faceCanvas.width / 2, faceCanvas.height * 0.48, t);
      faceTexture.needsUpdate = true;
    }

    // --- SLEEP FACE (global 10s idle, anywhere on the page) ---
    function renderSleepFace(t) {
      drawYellowBase();
      const cx = faceCanvas.width / 2;
      const cy = faceCanvas.height * 0.48;
      faceCtx.strokeStyle = '#221808';
      faceCtx.lineWidth = 8;
      faceCtx.lineCap = 'round';
      faceCtx.beginPath(); faceCtx.arc(cx - 80, cy, 30, 0.2, Math.PI - 0.2); faceCtx.stroke();
      faceCtx.beginPath(); faceCtx.arc(cx + 80, cy, 30, 0.2, Math.PI - 0.2); faceCtx.stroke();

      faceCtx.font = '700 60px monospace';
      faceCtx.fillStyle = '#221808';
      for (let i = 0; i < 3; i++) {
        const b = (t * 0.001 + i * 0.6) % 1.8;
        faceCtx.globalAlpha = 1 - b / 1.8;
        faceCtx.fillText('z', cx + 150 + i * 35, cy - 90 - b * 60);
      }
      faceCtx.globalAlpha = 1;
      faceTexture.needsUpdate = true;
    }

    // --- TRACKING FACE (Outside container state) ---
    let currentLookX = 0;
    let currentLookY = 0;

    function renderTrackingFace(lookOffsetX, lookOffsetY) {
      drawYellowBase();
      const cx = faceCanvas.width / 2;
      const cy = faceCanvas.height * 0.48;

      const pupilShiftX = lookOffsetX * 24;
      const pupilShiftY = lookOffsetY * 24;

      function drawEye(eyeX, isLeft) {
        faceCtx.save();
        faceCtx.strokeStyle = '#221808';
        faceCtx.lineWidth = 14;
        faceCtx.lineCap = 'round';
        faceCtx.beginPath();
        faceCtx.arc(eyeX + (isLeft ? -10 : 10), cy - 80, 54, Math.PI * 1.15, Math.PI * 1.85);
        faceCtx.stroke();
        faceCtx.restore();

        drawAliveEye(eyeX, cy, 68, pupilShiftX, pupilShiftY);
      }

      drawEye(cx - 82, true);
      drawEye(cx + 82, false);

      faceCtx.fillStyle = '#221808';
      faceCtx.beginPath(); faceCtx.arc(cx, cy + 70, 16, 0, Math.PI * 2); faceCtx.fill();
      faceTexture.needsUpdate = true;
    }

    function getFaceX(baseAngle) {
      const w = faceCanvas.width;
      let x = w * 0.5 + w * (baseAngle / (Math.PI * 2));
      return x % w;
    }

    function renderStaticEmojiFaces() {
      drawYellowBase();
      const cy = faceCanvas.height * 0.48;

      drawSunglassesFace(getFaceX(0), cy);
      drawWinkFace(getFaceX((2 * Math.PI) / 3), cy);
      drawBlushSmileFace(getFaceX((4 * Math.PI) / 3), cy);

      faceTexture.needsUpdate = true;
    }

    // =========================================================================
    // 3. BUTTON DATA
    // =========================================================================
    const BUTTON_DATA = [
      { id: 'A', name: 'BUTTON A', url: 'https://example.com/page-a' },
      { id: 'B', name: 'BUTTON B', url: 'https://example.com/page-b' },
      { id: 'C', name: 'BUTTON C', url: 'https://example.com/page-c' }
    ];

    // =========================================================================
    // 4. SCENE & CAMERA SETUP
    // =========================================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030305);

    const camera = new THREE.PerspectiveCamera(45, widgetContainer.clientWidth / widgetContainer.clientHeight, 1, 2000);
    camera.position.set(0, 10, 46);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(widgetContainer.clientWidth, widgetContainer.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    widgetContainer.appendChild(renderer.domElement);

    // =========================================================================
    // 5. TRUNCATED SPHERE GEOMETRY & LED FACE SHADER
    // =========================================================================
    const radius = 13;
    const sphereGeo = new THREE.SphereGeometry(radius, 256, 128, 0, Math.PI * 2, 0, 2.32);
    sphereGeo.computeBoundingBox();
    sphereGeo.translate(0, -(sphereGeo.boundingBox.max.y + sphereGeo.boundingBox.min.y) / 2, 0);

    const sphereShaderMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uFaceTexture: { value: faceTexture },
        uLedDensity: { value: new THREE.Vector2(400.0, 200.0) },
        uPuckSize: { value: 0.85 },
      },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vNormal;
        void main() {
          vUv = uv;
          vNormal = normalize(normalMatrix * normal);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D uFaceTexture;
        uniform vec2 uLedDensity;
        uniform float uPuckSize;
        varying vec2 vUv;
        varying vec3 vNormal;

        #define PI 3.14159265359

        void main() {
          float theta = vUv.y * PI;
          float ringScale = max(sin(theta), 0.05);
          vec2 puckCount = vec2(floor(uLedDensity.x * ringScale), uLedDensity.y);
          puckCount.x = max(puckCount.x, 8.0);

          vec2 cellUv = fract(vUv * puckCount) * 2.0 - 1.0;
          float dist = length(cellUv);

          vec2 dUv = fwidth(vUv * puckCount);
          float pixelFootprint = length(dUv);
          float effectivePuckSize = clamp(uPuckSize + pixelFootprint * 0.5, uPuckSize, 1.414);
          float filterWidth = max(pixelFootprint, 0.05);

          float puckMask = 1.0 - smoothstep(effectivePuckSize - filterWidth, effectivePuckSize + filterWidth, dist);
          puckMask = max(puckMask, clamp(pixelFootprint * 0.4, 0.0, 0.7));

          vec2 sampleUv = (floor(vUv * puckCount) + 0.5) / puckCount;

          vec3 emission = texture2D(uFaceTexture, sampleUv).rgb;

          vec3 finalColor = emission * puckMask;
          float rim = 1.0 - max(dot(vec3(0.0, 0.0, 1.0), vNormal), 0.0);
          finalColor += pow(rim, 3.0) * 0.25 * emission;

          gl_FragColor = vec4(finalColor, 1.0);
        }
      `,
      side: THREE.FrontSide
    });

    const sphereGroup = new THREE.Group();
    scene.add(sphereGroup);

    const dome = new THREE.Mesh(sphereGeo, sphereShaderMaterial);
    sphereGroup.add(dome);

    const innerHullMat = new THREE.MeshBasicMaterial({ color: 0x010101, side: THREE.BackSide });
    const innerHull = new THREE.Mesh(sphereGeo.clone(), innerHullMat);
    sphereGroup.add(innerHull);

    dome.rotation.y = -Math.PI / 2;
    innerHull.rotation.y = -Math.PI / 2;

    // =========================================================================
    // 6. DECOUPLED ORBIT SYSTEM (SIBLING TO SPHERE)
    // =========================================================================
    const orbitSpinGroup = new THREE.Group();
    scene.add(orbitSpinGroup);

    const orbitTiltGroup = new THREE.Group();
    orbitSpinGroup.add(orbitTiltGroup);

    orbitTiltGroup.rotation.set(THREE.MathUtils.degToRad(5), 0, THREE.MathUtils.degToRad(-15));

    const orbitRadius = radius + 3.5;
    const bannerArc = Math.PI / 4.0;
    const numButtons = BUTTON_DATA.length;

    const gapArc = (2 * Math.PI / numButtons) - bannerArc;
    const ringCurveMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.35, side: THREE.DoubleSide });

    for (let i = 0; i < numButtons; i++) {
      const centerAngle = (i * 2 * Math.PI) / numButtons;
      const gapGeo = new THREE.RingGeometry(orbitRadius - 0.04, orbitRadius + 0.04, 32, 1, centerAngle + bannerArc / 2, gapArc);
      gapGeo.rotateX(-Math.PI / 2);
      orbitTiltGroup.add(new THREE.Mesh(gapGeo, ringCurveMat));
    }

    // =========================================================================
    // 7. BUTTON STYLING
    // =========================================================================
    function createBannerTexture(text, isHovered) {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 140;
      const ctx = canvas.getContext('2d');
      const padX = 14, padY = 14, w = canvas.width - padX * 2, h = canvas.height - padY * 2, r = 24;

      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(padX, padY, w, h, r);
      else { ctx.moveTo(padX + r, padY); ctx.arcTo(padX + w, padY, padX + w, padY + h, r); ctx.arcTo(padX + w, padY + h, padX, padY + h, r); ctx.arcTo(padX, padY + h, padX, padY, r); ctx.arcTo(padX, padY, padX + w, padY, r); }
      ctx.closePath();

      const grad = ctx.createLinearGradient(padX, padY, padX + w, padY + h);
      grad.addColorStop(0, 'rgba(10, 24, 44, 0.95)'); grad.addColorStop(1, 'rgba(4, 12, 22, 0.95)');
      ctx.fillStyle = grad; ctx.fill();

      ctx.lineWidth = isHovered ? 6.0 : 2.5;
      ctx.strokeStyle = isHovered ? '#ffffff' : '#00ffff';
      ctx.shadowColor = 'rgba(0, 255, 255, 0.8)'; ctx.shadowBlur = isHovered ? 20 : 10; ctx.stroke();

      ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 8;
      ctx.font = '900 42px "Segoe UI", Roboto, monospace'; ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);

      const tex = new THREE.CanvasTexture(canvas); tex.needsUpdate = true; return tex;
    }

    const bannerGeo = new THREE.CylinderGeometry(orbitRadius, orbitRadius, 2.4, 32, 1, true, -bannerArc / 2, bannerArc);
    const buttonMeshes = [];

    BUTTON_DATA.forEach((btnData, i) => {
      const baseAngle = (i * 2 * Math.PI) / numButtons;
      const mesh = new THREE.Mesh(bannerGeo, new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, transparent: true, map: createBannerTexture(btnData.name, false) }));
      mesh.rotation.y = baseAngle;
      mesh.userData = { config: btnData, baseAngle: baseAngle, isHovered: false };
      orbitTiltGroup.add(mesh);
      buttonMeshes.push(mesh);
    });

    // =========================================================================
    // 8. INTERACTION & INDEPENDENT SCROLL ROTATION
    // =========================================================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(-999, -999);

    let sphereTargetRotation = 0;
    let orbitTargetRotation = 0;

    widgetContainer.addEventListener('mousemove', (e) => {
      const rect = widgetContainer.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      checkButtonHover();
    });

    function checkButtonHover() {
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(buttonMeshes);
      const hoveredMesh = hits.length > 0 ? hits[0].object : null;
      widgetContainer.style.cursor = hoveredMesh ? 'pointer' : 'default';

      buttonMeshes.forEach((mesh) => {
        const shouldBeHovered = (mesh === hoveredMesh);
        if (mesh.userData.isHovered !== shouldBeHovered) {
          mesh.userData.isHovered = shouldBeHovered;
          mesh.material.map.dispose();
          mesh.material.map = createBannerTexture(mesh.userData.config.name, shouldBeHovered);
          mesh.material.needsUpdate = true;
        }
      });
    }

    widgetContainer.addEventListener('wheel', (e) => {
      e.preventDefault();
      const step = 0.12;
      if (e.deltaY > 0) {
        sphereTargetRotation -= step;
        orbitTargetRotation -= step;
      } else if (e.deltaY < 0) {
        sphereTargetRotation += step;
        orbitTargetRotation += step;
      }
    }, { passive: false });

    widgetContainer.addEventListener('click', () => {
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(buttonMeshes);
      if (hits.length > 0 && hits[0].object.userData.config.url) {
        window.open(hits[0].object.userData.config.url, '_blank');
      }
    });

    window.addEventListener('resize', () => {
      const w = widgetContainer.clientWidth;
      const h = widgetContainer.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    // =========================================================================
    // 9. RENDER LOOP — sleep (global 10s idle) > idle-expressive (hover stall) >
    //    static button faces (hovering + moving) > eye-tracking (outside)
    // =========================================================================
    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = now - lastFrameT;
      lastFrameT = now;
      updateBlink(dt);

      const globalIdle = (now - lastMoveTime) > 10000; // anywhere on page, not just inside widget
      const insideStalled = isPointerInsideContainer && (now - lastInsideMoveTime) > 1200;

      if (globalIdle) {
        renderSleepFace(now);
        textureState = 'SLEEP';
      } else if (isPointerInsideContainer) {
        if (insideStalled) {
          renderIdleExpressiveFace(now);
          textureState = 'IDLE_EXPR';
        } else {
          renderStaticEmojiFaces();
          textureState = 'INSIDE';
        }
      } else {
        const rect = widgetContainer.getBoundingClientRect();
        const dx = windowMouse.x - (rect.left + rect.width / 2);
        const dy = windowMouse.y - (rect.top + rect.height / 2);
        const dist = Math.sqrt(dx * dx + dy * dy);

        const intensity = Math.min(dist / 700, 1.0);
        currentLookX += ((dist > 0 ? (dx / dist) : 0) * intensity - currentLookX) * 0.12;
        currentLookY += ((dist > 0 ? (dy / dist) : 0) * intensity - currentLookY) * 0.12;

        renderTrackingFace(currentLookX, currentLookY);
        textureState = 'OUTSIDE';

        const nearestFront = Math.round(sphereTargetRotation / (Math.PI * 2)) * (Math.PI * 2);
        sphereTargetRotation += (nearestFront - sphereTargetRotation) * 0.05;
      }

      // Gentle breathing so the sphere feels alive even when static
      const breathe = 1 + Math.sin(now * 0.0015) * 0.008;
      sphereGroup.scale.set(breathe, breathe, breathe);

      sphereGroup.rotation.y += (sphereTargetRotation - sphereGroup.rotation.y) * 0.1;
      orbitSpinGroup.rotation.y += (orbitTargetRotation - orbitSpinGroup.rotation.y) * 0.1;

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
