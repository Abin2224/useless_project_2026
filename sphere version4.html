<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sphere Vegas Replica with Flying Banner Buttons</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030305;
      font-family: monospace;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }
    #ui {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: #888;
      font-size: 12px;
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="ui">Hover &amp; scroll to rotate orbit | Click buttons to navigate</div>

  <script>
    // =========================================================================
    // 1. BUTTON DATA & HYPERLINK CONFIGURATION
    // =========================================================================
    const BUTTON_DATA = [
      { 
        id: 'A', 
        name: 'BUTTON A', 
        url: 'https://example.com/page-a' // <-- URL FOR BUTTON A
      },
      { 
        id: 'B', 
        name: 'BUTTON B', 
        url: 'https://example.com/page-b' // <-- URL FOR BUTTON B
      },
      { 
        id: 'C', 
        name: 'BUTTON C', 
        url: 'https://example.com/page-c' // <-- URL FOR BUTTON C
      }
    ];

    // =========================================================================
    // 2. SCENE & CAMERA SETUP
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a101f);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      1,
      2000
    );
    camera.position.set(0, 10, 75);
    camera.lookAt(-10, -10, 0);

    const renderer = new THREE.WebGLRenderer({ 
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // =========================================================================
    // 3. TRUNCATED SPHERE GEOMETRY & HIGH-DENSITY LED SHADER
    // =========================================================================
    const radius = 13;
    const widthSegments = 256;
    const heightSegments = 128;
    const phiStart = 0;
    const phiLength = Math.PI * 2;
    const thetaStart = 0;
    const thetaLength = 2.32;

    const sphereGeo = new THREE.SphereGeometry(
      radius,
      widthSegments,
      heightSegments,
      phiStart,
      phiLength,
      thetaStart,
      thetaLength
    );

    sphereGeo.computeBoundingBox();
    const box = sphereGeo.boundingBox;
    const verticalCenterOffset = -(box.max.y + box.min.y) / 2;
    sphereGeo.translate(0, verticalCenterOffset, 0);

    const sphereShaderMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 1.5 },
        uLedDensity: { value: new THREE.Vector2(400.0, 200.0) },
        uPuckSize: { value: 0.85 },
      },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vPosition;
        void main() {
          vUv = uv;
          vNormal = normalize(normalMatrix * normal);
          vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform vec2 uLedDensity;
        uniform float uPuckSize;
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vPosition;

        #define PI 3.14159265359

        vec3 generateSphereContent(vec2 uv, float t) {
          vec2 p = uv * 2.0 - 1.0;
          p.x *= 1.5;
          float r = length(p);
          float ring = sin(r * 18.0 - t * 3.0);
          
          vec3 col1 = vec3(1.0, 0.2, 0.05);
          vec3 col2 = vec3(0.05, 0.6, 1.0);
          vec3 col3 = vec3(0.9, 0.0, 0.4);
          
          vec3 col = mix(col1, col2, 0.5 + 0.5 * sin(t + p.x * 2.0));
          col = mix(col, col3, step(0.6, ring));
          
          if (r < 0.35) {
            col = mix(vec3(1.0, 1.0, 1.0), col1, r / 0.35);
          }
          return col;
        }

        void main() {
          float theta = vUv.y * PI;
          float ringScale = max(sin(theta), 0.05);

          vec2 puckCount = vec2(floor(uLedDensity.x * ringScale), uLedDensity.y);
          puckCount.x = max(puckCount.x, 8.0);

          vec2 cellUv = fract(vUv * puckCount) * 2.0 - 1.0;
          float dist = length(cellUv);

          vec2 dUv = fwidth(vUv * puckCount);
          float pixelFootprint = length(dUv);

          float effectivePuckSize = clamp(uPuckSize + pixelFootprint * 0.5, uPuckSize, 1.414);
          float filterWidth = max(pixelFootprint, 0.05);

          float puckMask = 1.0 - smoothstep(effectivePuckSize - filterWidth, effectivePuckSize + filterWidth, dist);
          
          float coverageFloor = clamp(pixelFootprint * 0.4, 0.0, 0.7);
          puckMask = max(puckMask, coverageFloor);

          vec2 sampleUv = (floor(vUv * puckCount) + 0.5) / puckCount;
          vec3 emission = generateSphereContent(sampleUv, uTime);

          vec3 finalColor = emission * puckMask;

          float rim = 1.0 - max(dot(vec3(0.0, 0.0, 1.0), vNormal), 0.0);
          finalColor += pow(rim, 3.0) * 0.2 * emission;

          gl_FragColor = vec4(finalColor, 1.0);
        }
      `,
      side: THREE.FrontSide
    });

    const sphereGroup = new THREE.Group();
    scene.add(sphereGroup);
    sphereGroup.position.set(-10, -10, 0);

    const dome = new THREE.Mesh(sphereGeo, sphereShaderMaterial);
    sphereGroup.add(dome);

    const innerHullGeo = sphereGeo.clone();
    const innerHullMat = new THREE.MeshBasicMaterial({ color: 0x010101, side: THREE.BackSide });
    const innerHull = new THREE.Mesh(innerHullGeo, innerHullMat);
    sphereGroup.add(innerHull);

    // =========================================================================
    // 4. ORBIT SYSTEM (VERTICAL Y-AXIS REVOLUTION + X/Z PERSPECTIVE TILT)
    // =========================================================================
    const orbitSpinGroup = new THREE.Group();
    sphereGroup.add(orbitSpinGroup);

    const orbitTiltGroup = new THREE.Group();
    orbitSpinGroup.add(orbitTiltGroup);

    // [ORBIT TILT ADJUSTMENTS]
    const ORBIT_TILT_X = THREE.MathUtils.degToRad(5);  // Pitch tilt
    const ORBIT_TILT_Y = THREE.MathUtils.degToRad(0);   // Keep 0 to lock with vertical pole
    const ORBIT_TILT_Z = THREE.MathUtils.degToRad(-15); // Lateral Z roll

    orbitTiltGroup.rotation.set(ORBIT_TILT_X, ORBIT_TILT_Y, ORBIT_TILT_Z);

    const orbitRadius = radius + 3.5; // Distance from sphere center to button orbit;
    const bannerArc = Math.PI / 4.0; // Angular width of each button
    const numButtons = BUTTON_DATA.length;

    // --- Orbital Trace Lines (Connecting side-to-side between buttons) ---
    // Instead of cutting through the buttons, we create 3 segments that span ONLY the gaps
    const gapArc = (2 * Math.PI / numButtons) - bannerArc;
    const ringCurveMat = new THREE.MeshBasicMaterial({
      color: 0x00ffff,
      transparent: true,
      opacity: 0.35,
      side: THREE.DoubleSide
    });

    for (let i = 0; i < numButtons; i++) {
      const centerAngle = (i * 2 * Math.PI) / numButtons;
      // Start at the trailing edge of button i, end at leading edge of next button
      const gapStart = centerAngle + bannerArc / 2;
      
      const gapGeo = new THREE.RingGeometry(
        orbitRadius - 0.04, 
        orbitRadius + 0.04, 
        32, 
        1, 
        gapStart, 
        gapArc
      );
      gapGeo.rotateX(-Math.PI / 2); // Orient flat along the orbit plane
      const gapMesh = new THREE.Mesh(gapGeo, ringCurveMat);
      orbitTiltGroup.add(gapMesh);
    }

    // =========================================================================
    // 5. BUTTON STYLING CONFIGURATION & PROCEDURAL CANVASES
    // =========================================================================
    // -------------------------------------------------------------------------
    // >>> CHANGE BUTTON APPEARANCE, COLORS, AND BORDERS HERE <<<
    // -------------------------------------------------------------------------
    const BUTTON_STYLE_CONFIG = {
      borderColor: '#00ffff',              // Neon border color
      borderHoverColor: '#ffffff',         // Border color on mouse hover
      glowColor: 'rgba(0, 255, 255, 0.8)', // Outer neon glow
      
      borderWidthDefault: 2.5,             // Default slim border thickness
      borderWidthHover: 6.0,               // Thicker border on hover
      
      borderRadius: 24,                    // Rounded corner radius
      
      bgGradientTop: 'rgba(10, 24, 44, 0.95)',
      bgGradientBottom: 'rgba(4, 12, 22, 0.95)',
      
      textColor: '#ffffff',
      textGlowColor: '#00ffff'
    };

    function createBannerTexture(text, isHovered) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 140;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const padX = 14;
      const padY = 14;
      const w = canvas.width - padX * 2;
      const h = canvas.height - padY * 2;
      const r = BUTTON_STYLE_CONFIG.borderRadius;

      ctx.save();
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(padX, padY, w, h, r);
      } else {
        ctx.moveTo(padX + r, padY);
        ctx.arcTo(padX + w, padY, padX + w, padY + h, r);
        ctx.arcTo(padX + w, padY + h, padX, padY + h, r);
        ctx.arcTo(padX, padY + h, padX, padY, r);
        ctx.arcTo(padX, padY, padX + w, padY, r);
      }
      ctx.closePath();

      // Background Fill
      const grad = ctx.createLinearGradient(padX, padY, padX + w, padY + h);
      grad.addColorStop(0, BUTTON_STYLE_CONFIG.bgGradientTop);
      grad.addColorStop(1, BUTTON_STYLE_CONFIG.bgGradientBottom);
      ctx.fillStyle = grad;
      ctx.fill();

      // Border & Neon Glow: Reduced thickness by default, increases on hover
      const strokeWidth = isHovered 
        ? BUTTON_STYLE_CONFIG.borderWidthHover 
        : BUTTON_STYLE_CONFIG.borderWidthDefault;
      
      ctx.lineWidth = strokeWidth;
      ctx.strokeStyle = isHovered 
        ? BUTTON_STYLE_CONFIG.borderHoverColor 
        : BUTTON_STYLE_CONFIG.borderColor;
      
      ctx.shadowColor = BUTTON_STYLE_CONFIG.glowColor;
      ctx.shadowBlur = isHovered ? 20 : 10;
      ctx.stroke();

      // Button Label Typography
      ctx.shadowColor = BUTTON_STYLE_CONFIG.textGlowColor;
      ctx.shadowBlur = 8;
      ctx.font = '900 42px "Segoe UI", Roboto, monospace';
      ctx.fillStyle = BUTTON_STYLE_CONFIG.textColor;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

    const bannerHeight = 2.4;
    const bannerGeo = new THREE.CylinderGeometry(
      orbitRadius,
      orbitRadius,
      bannerHeight,
      32,
      1,
      true,
      -bannerArc / 2,
      bannerArc
    );

    const buttonMeshes = [];

    BUTTON_DATA.forEach((btnData, i) => {
      const baseAngle = (i * 2 * Math.PI) / numButtons;

      // Every button now gets identical neon styling
      const mat = new THREE.MeshBasicMaterial({
        side: THREE.DoubleSide,
        transparent: true,
        map: createBannerTexture(btnData.name, false)
      });

      const mesh = new THREE.Mesh(bannerGeo, mat);
      mesh.rotation.y = baseAngle;

      mesh.userData = {
        config: btnData,
        baseAngle: baseAngle,
        isHovered: false
      };

      orbitTiltGroup.add(mesh);
      buttonMeshes.push(mesh);
    });

    // =========================================================================
    // 6. SYNCHRONIZED SCROLL & HOVER INTERACTION
    // =========================================================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(-999, -999);
    let targetRotation = 0;

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      checkButtonHover();
    });

    function checkButtonHover() {
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(buttonMeshes);
      const hoveredMesh = hits.length > 0 ? hits[0].object : null;

      // Update cursor style
      document.body.style.cursor = hoveredMesh ? 'pointer' : 'default';

      // Dynamically increase border thickness on the hovered button
      buttonMeshes.forEach((mesh) => {
        const shouldBeHovered = (mesh === hoveredMesh);
        if (mesh.userData.isHovered !== shouldBeHovered) {
          mesh.userData.isHovered = shouldBeHovered;
          mesh.material.map.dispose();
          mesh.material.map = createBannerTexture(mesh.userData.config.name, shouldBeHovered);
          mesh.material.needsUpdate = true;
        }
      });
    }

    window.addEventListener('wheel', (e) => {
      raycaster.setFromCamera(mouse, camera);
      const interactiveTargets = [dome, ...buttonMeshes];
      const hits = raycaster.intersectObjects(interactiveTargets);

      if (hits.length > 0) {
        e.preventDefault();
        const step = 0.12;
        if (e.deltaY > 0) {
          targetRotation -= step; // Scroll down -> Clockwise
        } else if (e.deltaY < 0) {
          targetRotation += step; // Scroll up -> Anti-clockwise
        }
      }
    }, { passive: false });

    // Click navigation
    window.addEventListener('click', () => {
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(buttonMeshes);
      if (hits.length > 0) {
        const clickedButton = hits[0].object;
        if (clickedButton.userData.config.url) {
          window.open(clickedButton.userData.config.url, '_blank');
        }
      }
    });

    // =========================================================================
    // 7. WINDOW RESIZE HANDLING
    // =========================================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // =========================================================================
    // 8. RENDER LOOP
    // =========================================================================
    function animate() {
      requestAnimationFrame(animate);

      // Sphere and orbital track spin synchronously on the vertical Y axis
      sphereGroup.rotation.y += (targetRotation - sphereGroup.rotation.y) * 0.1;
      orbitSpinGroup.rotation.y = sphereGroup.rotation.y;

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
